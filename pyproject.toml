[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend service for Vita"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15.2",
    "aioboto3>=15.4.0",
    "aiofiles>=25.1.0",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "google-genai>=1.30.0",
    "greenlet>=3.2.1",
    "httpx>=0.28.1",
    "langchain-core>=1.2.20",
    "langgraph>=1.1.3",
    "lxml>=6.0.2",
    "playwright>=1.58.0",
    "scrapling[fetchers]>=0.4.2",
    "pydantic-settings>=2.8.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.39",
    "structlog>=24.4.0",
    "uvicorn>=0.34.0",
    "dspy>=3.1.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "langgraph>=1.1.3",
    "pre-commit>=4.5.1",
]
